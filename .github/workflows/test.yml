name: CI/CD
on:
  push:
    branches: [ main, module11, module12 ]
  pull_request:
    branches: [ main, module11, module12 ]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg2://user:password@localhost:5432/myappdb
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: myappdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          playwright install
      - name: Run tests
        run: |
          source venv/bin/activate
          python -m pytest tests/unit/ tests/integration/ -v
          python -m pytest tests/e2e/ -v
  security:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build image
        run: docker build -t app:test .
      
      - name: Diagnose setuptools vulnerability
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'app:test'
          format: 'json'
          output: 'trivy-diagnostic.json'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-diagnostic
          path: trivy-diagnostic.json

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'app:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
  deploy:
    needs: security
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/module11' || github.ref == 'refs/heads/module12' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - uses: docker/setup-buildx-action@v3
      
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            sb2786/601_module9:${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
            sb2786/601_module9:${{ github.sha }}

          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=sb2786/601_module9:cache
          cache-to: type=inline,mode=max
